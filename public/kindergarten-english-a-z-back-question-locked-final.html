<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyVault — Kindergarten English: A–Z</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:linear-gradient(135deg,#dff4ff,#f4faff);color:#172033;display:flex;justify-content:center;padding:18px}
.app{width:min(900px,100%);min-height:calc(100vh - 36px);padding:22px;border:1px solid rgba(255,255,255,.8);border-radius:30px;background:rgba(255,255,255,.58);box-shadow:0 20px 60px rgba(40,100,150,.16);backdrop-filter:blur(24px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand{font-weight:900;font-size:20px}
.top-actions{display:flex;gap:8px;align-items:center}
.back,.close-btn{border:0;background:rgba(255,255,255,.78);padding:10px 15px;border-radius:14px;font-weight:800;cursor:pointer}
.close-btn{color:#9b3030}
.hero{text-align:center;padding:16px 8px}
.badge{display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.82);font-size:13px;font-weight:800}
h1{font-size:clamp(30px,6vw,50px);margin:15px 0 8px}
.subtitle{color:#5d6b80;margin:0 auto 22px;max-width:620px;line-height:1.5}
.progress-wrap{max-width:620px;margin:0 auto 24px}
.progress-track{height:10px;background:rgba(255,255,255,.72);border-radius:99px;overflow:hidden}
.progress{height:100%;width:0;background:#2584d8;border-radius:99px;transition:width .25s}
.progress-text{display:flex;justify-content:space-between;margin-top:8px;color:#68768a;font-size:13px;font-weight:800}
.card{max-width:620px;margin:0 auto;padding:28px;border-radius:26px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.92);box-shadow:0 12px 35px rgba(40,90,130,.1)}
.question-number{color:#2584d8;font-size:14px;font-weight:900;margin-bottom:10px}
.question{font-size:clamp(34px,8vw,54px);font-weight:900;text-align:center;margin:18px 0 28px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.choice{min-height:64px;border:1px solid #d9e5ef;background:rgba(255,255,255,.92);border-radius:17px;font-size:22px;font-weight:900;cursor:pointer}
.choice.correct{background:#dcf8e9;border-color:#73d49d}
.choice.wrong{background:#ffe4e4;border-color:#ef9090}
.choice:disabled{cursor:default}
.feedback{min-height:30px;text-align:center;font-weight:900;margin-top:18px}
.next{display:block;margin:16px auto 0;border:0;background:#2584d8;color:white;padding:13px 24px;border-radius:15px;font-weight:900;cursor:pointer;font-size:15px}
.next:disabled{opacity:.45;cursor:not-allowed}
.results{text-align:center}
.score{font-size:64px;font-weight:950;margin:8px 0}
.results p{color:#5d6b80;line-height:1.5}
.retry,.home{border:0;padding:13px 20px;border-radius:15px;font-weight:900;cursor:pointer;margin:6px}
.retry{background:#2584d8;color:white}
.home{background:#e6eff7;color:#172033}
.hidden{display:none}
.quit-overlay.hidden{display:none}.quit-overlay{position:fixed;inset:0;background:rgba(20,30,45,.38);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}
.quit-modal{width:min(460px,100%);padding:28px;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);box-shadow:0 24px 70px rgba(20,40,70,.25);text-align:center}
.quit-modal h2{margin:0 0 10px;font-size:28px}
.quit-modal p{margin:0 0 24px;color:#5d6b80;line-height:1.5}
.quit-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quit-actions button{border:0;border-radius:15px;padding:13px 16px;font-weight:900;font-size:15px;cursor:pointer}
.quit-now{background:#d95353;color:white}
.continue-learning{background:#2584d8;color:white}
@media(max-width:600px){body{padding:9px}.app{min-height:calc(100vh - 18px);padding:15px;border-radius:24px}.card{padding:22px 16px}.choices{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">StudyVault</div>
    <div class="top-actions">
      <button class="back" type="button" onclick="backQuestion()">← Back</button>
      <button class="close-btn" type="button" onclick="requestQuit()">Close</button>
    </div>
  </div>

  <section id="lesson">
    <div class="hero">
      <span class="badge">Kindergarten · English · A–Z</span>
      <h1>Let's get started! 🎯</h1>
      <p class="subtitle">Practice recognizing letters from A–Z by finding the letter that comes before or after.</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-track"><div id="progress" class="progress"></div></div>
      <div class="progress-text">
        <span id="progressLabel">Question 1 of 12</span>
        <span id="scoreLabel">Score: 0</span>
      </div>
    </div>

    <div class="card">
      <div id="questionNumber" class="question-number">QUESTION 1</div>
      <div id="question" class="question"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next" class="next" type="button" disabled>Next →</button>
    </div>
  </section>

  <div id="quitOverlay" class="quit-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="quitTitle">
    <div class="quit-modal">
      <h2 id="quitTitle">Do you want to quit?</h2>
      <p>You will lose your progress if you quit now.</p>
      <div class="quit-actions">
        <button class="quit-now" type="button" onclick="quitNow()">Quit Now</button>
        <button class="continue-learning" type="button" onclick="continueLearning()">Continue Learning</button>
      </div>
    </div>
  </div>

  <section id="results" class="card results hidden">
    <div class="badge">Lesson complete 🎉</div>
    <h1>Great job!</h1>
    <div id="finalScore" class="score">0%</div>
    <p id="resultMessage"></p>
    <button class="retry" type="button" onclick="restart()">Retake</button>
    <button class="home" type="button" onclick="goHome()">Back to StudyVault</button>
  </section>
</div>

<script>
"use strict";

const questions = [
  { q:"Which letter comes before M?", correct:"L", answers:["K","L","N","O"] },
  { q:"Which letter comes after C?", correct:"D", answers:["B","D","E","F"] },
  { q:"Which letter comes before H?", correct:"G", answers:["F","G","I","J"] },
  { q:"Which letter comes after T?", correct:"U", answers:["S","U","V","W"] },
  { q:"Which letter comes before F?", correct:"E", answers:["D","E","G","H"] },
  { q:"Which letter comes after A?", correct:"B", answers:["B","C","D","Z"] },
  { q:"Which letter comes before R?", correct:"Q", answers:["P","Q","S","T"] },
  { q:"Which letter comes after X?", correct:"Y", answers:["W","Y","Z","V"] },
  { q:"Which letter comes before D?", correct:"C", answers:["B","C","E","F"] },
  { q:"Which letter comes after N?", correct:"O", answers:["M","O","P","Q"] },
  { q:"Which letter comes before Z?", correct:"Y", answers:["W","X","Y","Z"] },
  { q:"Which letter comes after G?", correct:"H", answers:["F","H","I","J"] }
];

let current = 0;
let score = 0;
let answered = false;
const questionStates = questions.map(() => ({ answered:false, selected:null }));

const lessonEl = document.getElementById("lesson");
const resultsEl = document.getElementById("results");
const questionNumberEl = document.getElementById("questionNumber");
const questionEl = document.getElementById("question");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
const nextEl = document.getElementById("next");
const progressEl = document.getElementById("progress");
const progressLabelEl = document.getElementById("progressLabel");
const scoreLabelEl = document.getElementById("scoreLabel");
const finalScoreEl = document.getElementById("finalScore");
const resultMessageEl = document.getElementById("resultMessage");

function shuffle(items){
  const copy = [...items];
  for(let i = copy.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function renderQuestion(){
  const item = questions[current];
  const state = questionStates[current];
  answered = state.answered;

  questionNumberEl.textContent = "QUESTION " + (current + 1);
  questionEl.textContent = item.q;
  progressLabelEl.textContent = `Question ${current + 1} of ${questions.length}`;
  scoreLabelEl.textContent = `Score: ${score}`;
  progressEl.style.width = `${((current + 1) / questions.length) * 100}%`;
  feedbackEl.textContent = "";
  nextEl.disabled = !state.answered;
  nextEl.textContent = current === questions.length - 1 ? "See Results →" : "Next →";
  choicesEl.innerHTML = "";

  shuffle(item.answers).forEach(answer => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    button.textContent = answer;

    if(state.answered){
      button.disabled = true;
      if(answer === item.correct) button.classList.add("correct");
      if(answer === state.selected && answer !== item.correct) button.classList.add("wrong");
    } else {
      button.addEventListener("click", () => chooseAnswer(button, answer));
    }

    choicesEl.appendChild(button);
  });

  if(state.answered){
    feedbackEl.textContent = state.selected === item.correct
      ? "🎉 Correct! Great job."
      : `Almost! The correct answer is ${item.correct}.`;
  }
}

function chooseAnswer(button, answer){
  if(answered) return;

  const item = questions[current];
  const state = questionStates[current];

  state.answered = true;
  state.selected = answer;
  answered = true;

  const buttons = choicesEl.querySelectorAll(".choice");

  buttons.forEach(b => {
    b.disabled = true;
    if(b.textContent === item.correct) b.classList.add("correct");
  });

  if(answer === item.correct){
    score++;
    button.classList.add("correct");
    feedbackEl.textContent = "🎉 Correct! Great job.";
  }else{
    button.classList.add("wrong");
    feedbackEl.textContent = `Almost! The correct answer is ${item.correct}.`;
  }

  scoreLabelEl.textContent = `Score: ${score}`;
  nextEl.disabled = false;
}

function nextQuestion(){
  if(!answered) return;

  if(current < questions.length - 1){
    current++;
    renderQuestion();
  }else{
    showResults();
  }
}

function showResults(){
  lessonEl.classList.add("hidden");
  resultsEl.classList.remove("hidden");

  const percent = Math.round((score / questions.length) * 100);
  finalScoreEl.textContent = percent + "%";

  if(percent >= 70){
    resultMessageEl.textContent = `You passed with ${score} out of ${questions.length} correct! 🌟`;
  }else{
    resultMessageEl.textContent = `You got ${score} out of ${questions.length} correct. You can retake the lesson and try again! 💪`;
  }
}

function restart(){
  current = 0;
  score = 0;
  questionStates.forEach(state => {
    state.answered = false;
    state.selected = null;
  });
  lessonEl.classList.remove("hidden");
  resultsEl.classList.add("hidden");
  renderQuestion();
}

function backQuestion(){
  if(current > 0){
    current--;
    renderQuestion();
  }
}

function requestQuit(){
  document.getElementById("quitOverlay").classList.remove("hidden");
}

function continueLearning(){
  document.getElementById("quitOverlay").classList.add("hidden");
}

function quitNow(){
  // Quit the lesson and return to the main StudyVault website.
  window.location.assign("../index.html");
}

document.addEventListener("keydown", function(event){
  if(event.key === "Escape"){
    event.preventDefault();
    requestQuit();
  }
}); 

function goHome(){
  window.location.href = "../index.html";
}

nextEl.addEventListener("click", nextQuestion);
renderQuestion();
</script>
</body>
</html>
