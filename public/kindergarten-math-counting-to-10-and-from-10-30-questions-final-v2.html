<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Math — Counting to 10 and From 10</title>
<style>
:root{
  --purple:#6d5dfc;--blue:#2f80ed;--green:#20b486;
  --red:#ef6b73;--ink:#182230;--muted:#667085;
  --bg:#f6f8fc;--card:#fff;--line:#e7ebf2
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,
  BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#f6f8fc 0%,#eef4ff 100%);
  color:var(--ink);min-height:100vh
}
.app{max-width:900px;margin:0 auto;padding:28px 18px 50px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.lesson-controls{display:flex;gap:10px;align-items:center}
.control-btn{padding:10px 16px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:850}
.control-btn:hover{background:#f8f9ff;border-color:#c8cffc}
.control-btn.quit{color:#c73d48;border-color:#f0c7cb}
.control-btn:disabled{opacity:.45;cursor:not-allowed}
.brand{font-size:22px;font-weight:900;letter-spacing:-.5px}
.brand span{color:var(--purple)}
.tag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 45px rgba(35,45,75,.08);padding:28px}
h1{margin:0;font-size:30px;letter-spacing:-1px}
.subtitle{margin:7px 0 20px;color:var(--muted)}
.progress-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.progress{height:10px;flex:1;background:#edf0f6;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));transition:.25s}
.count{font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.mode{display:inline-block;background:#f0efff;color:#5546d8;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:850;margin-bottom:12px}
.question{text-align:center;font-size:25px;font-weight:850;margin:10px 0 20px}
.visual{
  min-height:145px;display:flex;align-items:center;justify-content:center;
  flex-wrap:wrap;gap:9px;padding:18px;margin-bottom:24px;
  background:#fafbff;border:1px solid var(--line);border-radius:20px;
  font-size:39px;line-height:1.3
}
.backward-sequence{font-size:24px;font-weight:850;letter-spacing:1px;color:#334155}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
button{font:inherit;cursor:pointer;border:0}
.choice{
  min-height:68px;background:#fff;border:2px solid var(--line);
  border-radius:16px;font-size:22px;font-weight:850;color:var(--ink);transition:.15s
}
.choice:hover{transform:translateY(-2px);border-color:#bfc7ff;background:#fafaff}
.choice.correct{border-color:var(--green);background:#eafaf4;color:#087a58}
.choice.wrong{border-color:var(--red);background:#fff0f1;color:#c73d48}
.feedback{min-height:52px;margin-top:18px;border-radius:15px;padding:14px 16px;text-align:center;font-weight:750;display:none}
.feedback.show{display:block}
.feedback.good{background:#eafaf4;color:#087a58}
.feedback.bad{background:#fff0f1;color:#c73d48}
.next{display:none;margin:18px auto 0;padding:13px 22px;border-radius:13px;background:var(--purple);color:#fff;font-weight:850}
.next.show{display:block}
.score{display:none;text-align:center;padding:25px 10px}
.score.show{display:block}
.score-icon{font-size:58px}
.score h2{font-size:28px;margin:8px 0}
.score p{color:var(--muted)}
.restart{padding:13px 22px;border-radius:13px;background:var(--blue);color:#fff;font-weight:850}
.tip{margin-top:18px;text-align:center;color:var(--muted);font-size:13px}
@media(max-width:600px){
  .app{padding:18px 12px 35px}.card{padding:20px}h1{font-size:25px}.lesson-controls{justify-content:space-between;margin-bottom:16px}
  .visual{font-size:32px;min-height:125px}
  .backward-sequence{font-size:18px}
  .choices{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Study<span>Vault</span></div>
    <div class="tag">Kindergarten Math</div>
  </div>

  <main class="card">
    <div id="lesson">
      <div class="lesson-controls">
        <button id="backBtn" class="control-btn" onclick="goBack()">← Back</button>
        <button class="control-btn quit" onclick="quitLesson()">Quit</button>
      </div>
      <h1>🔢 Counting to 10 and From 10</h1>
      <div class="subtitle">One lesson: count forward from 1 to 10 and count backward from 10.</div>

      <div class="progress-row">
        <div class="progress"><div id="bar" class="bar"></div></div>
        <div id="counter" class="count">Question 1 of 30</div>
      </div>

      <div id="mode" class="mode"></div>
      <div id="question" class="question"></div>
      <div id="visual" class="visual"></div>
      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>
      <button id="next" class="next" onclick="nextQuestion()">Next question →</button>
      <div class="tip">🌟 Count slowly and carefully. You can use the numbers on the screen to help.</div>
    </div>

    <div id="score" class="score">
      <div class="score-icon">🎉</div>
      <h2>Fantastic counting!</h2>
      <p id="scoreText"></p>
      <button class="restart" onclick="restart()">Try again</button>
    </div>
  </main>
</div>

<script>
const questions = [{"type": "forward", "prompt": "How many apples are there?", "emoji": "🍎", "answer": 1}, {"type": "forward", "prompt": "How many stars are there?", "emoji": "⭐", "answer": 2}, {"type": "forward", "prompt": "How many bears are there?", "emoji": "🐻", "answer": 3}, {"type": "forward", "prompt": "How many flowers are there?", "emoji": "🌸", "answer": 4}, {"type": "forward", "prompt": "How many butterflies are there?", "emoji": "🦋", "answer": 5}, {"type": "forward", "prompt": "How many strawberries are there?", "emoji": "🍓", "answer": 6}, {"type": "forward", "prompt": "How many frogs are there?", "emoji": "🐸", "answer": 7}, {"type": "forward", "prompt": "How many rainbows are there?", "emoji": "🌈", "answer": 8}, {"type": "forward", "prompt": "How many cars are there?", "emoji": "🚗", "answer": 9}, {"type": "forward", "prompt": "How many balloons are there?", "emoji": "🎈", "answer": 10}, {"type": "forward", "prompt": "Count carefully. How many cookies?", "emoji": "🍪", "answer": 3}, {"type": "forward", "prompt": "Count carefully. How many soccer balls?", "emoji": "⚽", "answer": 5}, {"type": "forward", "prompt": "Count carefully. How many dogs?", "emoji": "🐶", "answer": 7}, {"type": "forward", "prompt": "Count carefully. How many bananas?", "emoji": "🍌", "answer": 8}, {"type": "forward", "prompt": "Count carefully. How many suns?", "emoji": "☀️", "answer": 10}, {"type": "backward", "prompt": "Count backward from 10. What number comes next?", "start": 10, "answer": 9}, {"type": "backward", "prompt": "Count backward from 9. What number comes next?", "start": 9, "answer": 8}, {"type": "backward", "prompt": "Count backward from 8. What number comes next?", "start": 8, "answer": 7}, {"type": "backward", "prompt": "Count backward from 7. What number comes next?", "start": 7, "answer": 6}, {"type": "backward", "prompt": "Count backward from 6. What number comes next?", "start": 6, "answer": 5}, {"type": "backward", "prompt": "Count backward from 5. What number comes next?", "start": 5, "answer": 4}, {"type": "backward", "prompt": "Count backward from 4. What number comes next?", "start": 4, "answer": 3}, {"type": "backward", "prompt": "Count backward from 3. What number comes next?", "start": 3, "answer": 2}, {"type": "backward", "prompt": "Count backward from 2. What number comes next?", "start": 2, "answer": 1}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 9?", "start": 10, "answer": 8}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 8?", "start": 10, "answer": 7}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 7?", "start": 10, "answer": 6}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 6?", "start": 10, "answer": 5}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 5?", "start": 10, "answer": 4}, {"type": "backward", "prompt": "Start at 10 and count backward. Which number comes after 4?", "start": 10, "answer": 3}];

let current = 0;
let score = 0;
let answered = false;

function makeChoices(answer) {
  const set = new Set([answer]);
  while (set.size < 3) {
    const offset = Math.floor(Math.random() * 5) - 2;
    const value = answer + offset;
    if (value >= 1 && value <= 10) set.add(value);
  }
  return [...set].sort(() => Math.random() - 0.5);
}

function render() {
  answered = false;
  document.getElementById("backBtn").disabled = current === 0;
  const q = questions[current];

  document.getElementById("counter").textContent =
    `Question ${current + 1} of ${questions.length}`;
  document.getElementById("bar").style.width =
    `${(current / questions.length) * 100}%`;

  document.getElementById("mode").textContent =
    q.type === "forward" ? "Counting to 10" : "Counting from 10";

  document.getElementById("question").textContent = q.prompt;

  const visual = document.getElementById("visual");

  if (q.type === "forward") {
    visual.className = "visual";
    visual.textContent = Array(q.answer).fill(q.emoji).join(" ");
  } else {
    visual.className = "visual backward-sequence";
    let sequence = [];
    for (let i = q.start; i >= Math.max(1, q.answer); i--) sequence.push(i);
    visual.textContent = sequence.join("  →  ");
  }

  const choices = document.getElementById("choices");
  choices.innerHTML = "";

  makeChoices(q.answer).forEach(value => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = value;
    btn.onclick = () => choose(btn, value, q.answer);
    choices.appendChild(btn);
  });

  const feedback = document.getElementById("feedback");
  feedback.className = "feedback";
  feedback.textContent = "";
  document.getElementById("next").className = "next";
}

function choose(button, value, answer) {
  if (answered) return;
  answered = true;

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach(b => b.disabled = true);

  if (value === answer) {
    score++;
    button.classList.add("correct");
    showFeedback(`🎉 Correct! The answer is ${answer}.`, true);
  } else {
    button.classList.add("wrong");
    buttons.forEach(b => {
      if (Number(b.textContent) === answer) b.classList.add("correct");
    });
    showFeedback(`Almost! The correct answer is ${answer}.`, false);
  }

  document.getElementById("next").classList.add("show");
}

function showFeedback(text, good) {
  const el = document.getElementById("feedback");
  el.textContent = text;
  el.className = `feedback show ${good ? "good" : "bad"}`;
}

function goBack() {
  if (current <= 0) return;
  current--;
  render();
}

function quitLesson() {
  // Return to the main StudyVault page / Math → Kindergarten package.
  window.location.href = "/";
}

function nextQuestion() {
  current++;
  if (current >= questions.length) finish();
  else render();
}

function finish() {
  document.getElementById("lesson").style.display = "none";
  document.getElementById("score").classList.add("show");
  document.getElementById("scoreText").textContent =
    `You got ${score} out of ${questions.length} questions correct.`;
}

function restart() {
  current = 0;
  score = 0;
  document.getElementById("score").classList.remove("show");
  document.getElementById("lesson").style.display = "block";
  render();
}

render();
</script>
</body>
</html>
